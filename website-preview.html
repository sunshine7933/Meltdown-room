<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#16241d" />
  <title>The Meltdown Room — Founder Preview</title>
  <style>
    :root{
      --cream:#fff4dc;
      --ink:#f8ecd0;
      --wood:#2a1d14;
      --glass:rgba(21,63,72,.62);
      --glass2:rgba(255,255,255,.16);
      --line:rgba(211,243,246,.48);
      --shadow:0 18px 60px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:#0d1512;color:var(--ink);font-family:Georgia,"Times New Roman",serif}
    body{overflow:hidden}
    button{font:inherit}
    .app{position:relative;width:100%;height:100%;min-height:100dvh;background:#101814;isolation:isolate}
    .scene{position:absolute;inset:0;display:none;background:#101814}
    .scene.active{display:block}
    .scene-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
    .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.12),transparent 32%,transparent 68%,rgba(0,0,0,.4))}
    .topbar{position:absolute;z-index:3;left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand,.control{border:1px solid rgba(255,255,255,.24);background:rgba(28,20,14,.64);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow);color:var(--cream)}
    .brand{padding:10px 16px;border-radius:18px;text-shadow:0 2px 8px #000;font-size:clamp(16px,2vw,24px)}
    .control{cursor:pointer;border-radius:999px;padding:10px 14px;min-height:44px;transition:.18s ease}
    .control:hover,.control:focus-visible{transform:translateY(-1px);background:rgba(39,81,81,.76);outline:2px solid rgba(226,250,255,.7);outline-offset:2px}
    .bottom{position:absolute;z-index:4;left:50%;bottom:max(22px,calc(env(safe-area-inset-bottom) + 16px));transform:translateX(-50%);width:min(94vw,820px);display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
    .water-button{position:relative;overflow:hidden;min-width:190px;min-height:54px;padding:14px 24px;border-radius:999px;border:1px solid var(--line);color:#effeff;background:linear-gradient(135deg,rgba(29,99,107,.76),rgba(11,48,63,.68));box-shadow:0 10px 32px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;font-weight:700;letter-spacing:.035em;text-shadow:0 1px 8px rgba(0,0,0,.7);transition:transform .16s ease,filter .16s ease}
    .water-button::before{content:"";position:absolute;inset:-60% -30%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.25) 48%,transparent 61%);transform:translateX(-60%);animation:shimmer 5s ease-in-out infinite;pointer-events:none}
    .water-button:hover,.water-button:focus-visible{transform:translateY(-2px) scale(1.015);filter:brightness(1.08);outline:2px solid rgba(224,252,255,.78);outline-offset:3px}
    .water-button:active{transform:scale(.98)}
    @keyframes shimmer{0%,55%{transform:translateX(-70%)}80%,100%{transform:translateX(70%)}}
    .hint{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 18px;border-radius:16px;background:rgba(16,22,19,.48);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.17);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s ease}
    .hint.show{opacity:1}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media (max-width:700px){
      .scene-image{object-fit:cover}
      .brand{font-size:15px;padding:9px 12px}
      .bottom{bottom:max(14px,calc(env(safe-area-inset-bottom) + 10px));gap:9px}
      .water-button{min-width:150px;min-height:50px;padding:12px 18px;font-size:15px}
    }
    @media (prefers-reduced-motion:reduce){.water-button::before{animation:none}.water-button,.control{transition:none}}
  </style>
</head>
<body>
  <main class="app" aria-label="The Meltdown Room preview">
    <section id="property" class="scene active" aria-label="Property entrance">
      <img class="scene-image" src="home.png" alt="The Meltdown Room founder-approved farmhouse property" fetchpriority="high" />
      <div class="shade"></div>
      <div class="topbar">
        <div class="brand">The Meltdown Room</div>
        <button class="control" type="button" data-action="sound" aria-pressed="false">Sound Off</button>
      </div>
      <div class="bottom">
        <button class="water-button" type="button" data-go="great-room">Enter Property</button>
      </div>
    </section>

    <section id="great-room" class="scene" aria-label="Great Room">
      <img class="scene-image" src="great-room.png" alt="The Meltdown Room founder-approved Great Room" />
      <div class="shade"></div>
      <div class="topbar">
        <button class="control" type="button" data-go="property">← Property</button>
        <div class="brand">Great Room</div>
        <button class="control" type="button" data-go="property">Take Me Home</button>
      </div>
      <div class="bottom">
        <button class="water-button" type="button" data-coming="rooms">Explore Rooms</button>
        <button class="water-button" type="button" data-coming="nearby">Explore Near Me</button>
      </div>
    </section>

    <div id="hint" class="hint" role="status" aria-live="polite">Coming next — we’ll wire this to your locked rooms.</div>
    <span class="sr-only" id="scene-status" aria-live="polite"></span>
  </main>

  <script>
    const scenes=[...document.querySelectorAll('.scene')];
    const status=document.getElementById('scene-status');
    const hint=document.getElementById('hint');
    function showScene(id){
      scenes.forEach(s=>s.classList.toggle('active',s.id===id));
      const active=document.getElementById(id);
      status.textContent='Opened '+(active?.getAttribute('aria-label')||id);
      window.setTimeout(()=>active?.querySelector('button')?.focus({preventScroll:true}),80);
    }
    document.addEventListener('click',e=>{
      const go=e.target.closest('[data-go]');
      if(go){showScene(go.dataset.go);return;}
      const coming=e.target.closest('[data-coming]');
      if(coming){
        hint.textContent=coming.dataset.coming==='nearby'?'Explore Near Me is next: fishing, hiking, camping, parks and distance filters.':'Next we’ll connect all Founder-Locked rooms here.';
        hint.classList.add('show');
        clearTimeout(window.__hintTimer);
        window.__hintTimer=setTimeout(()=>hint.classList.remove('show'),2600);
        return;
      }
      const sound=e.target.closest('[data-action="sound"]');
      if(sound){
        const on=sound.getAttribute('aria-pressed')!=='true';
        sound.setAttribute('aria-pressed',String(on));
        sound.textContent=on?'Sound On':'Sound Off';
      }
    });
  </script>
</body>
</html>
