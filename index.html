<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#21150d"><title>The Meltdown Room</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#21150d;font-family:system-ui,-apple-system,sans-serif}body{overflow-x:hidden;color:#fff}.screen{display:none;position:relative;width:100%;min-height:100vh;background:#21150d}.screen.active{display:flex;align-items:center;justify-content:center}.scene{display:block;width:100%;height:auto;max-height:100vh;object-fit:contain}.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:rgba(255,255,255,.18)}.status{position:fixed;z-index:50;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:999px;background:#20150dd1;border:1px solid #9a774b;color:#f7e3bd;font-size:12px;pointer-events:none}
#homeHouse{left:37%;top:12%;width:47%;height:45%}#homeEntrance{left:0;bottom:0;width:15%;height:25%}#porchEnter{left:35%;top:66%;width:31%;height:17%}#porchHome{left:0;bottom:0;width:15%;height:22%}#greatBack{left:0;bottom:0;width:15%;height:12%}#greatHome{right:0;bottom:0;width:15%;height:12%}#greatRant{left:4%;top:79%;width:11%;height:12%}#rantBack{left:0;bottom:0;width:12%;height:10%}#rantHome{right:0;bottom:0;width:12%;height:10%}
@media(max-width:700px){.screen.active{align-items:flex-start}.scene{width:100%;height:100vh;object-fit:contain}#homeHouse{left:29%;top:18%;width:65%;height:37%}#homeEntrance{width:28%;height:24%}#porchEnter{left:26%;top:64%;width:48%;height:19%}#porchHome{width:28%;height:20%}#greatBack{width:27%;height:12%}#greatHome{width:27%;height:12%}#greatRant{left:0;top:76%;width:23%;height:15%}#rantBack{width:25%;height:12%}#rantHome{width:25%;height:12%}}</style></head><body>
<div class="status" id="status">Home • v0.3</div>
<section class="screen active" id="home"><img class="scene" src="home.png" alt="Home"><button class="hotspot" id="homeHouse" onclick="showScreen('entrance')" aria-label="Entrance"></button><button class="hotspot" id="homeEntrance" onclick="showScreen('entrance')" aria-label="Entrance"></button></section>
<section class="screen" id="entrance"><img class="scene" src="entrance.png" alt="Entrance"><button class="hotspot" id="porchEnter" onclick="showScreen('great')" aria-label="Enter Great Room"></button><button class="hotspot" id="porchHome" onclick="showScreen('home')" aria-label="Home"></button></section>
<section class="screen" id="great"><img class="scene" src="great-room.png" alt="Great Room"><button class="hotspot" id="greatRant" onclick="showScreen('rant')" aria-label="Rant Room"></button><button class="hotspot" id="greatBack" onclick="showScreen('entrance')" aria-label="Back"></button><button class="hotspot" id="greatHome" onclick="showScreen('home')" aria-label="Home"></button></section>
<section class="screen" id="rant"><img class="scene" src="rant-room.png" alt="Rant Room"><button class="hotspot" id="rantBack" onclick="showScreen('great')" aria-label="Back to Great Room"></button><button class="hotspot" id="rantHome" onclick="showScreen('home')" aria-label="Home"></button></section>
<script>const labels={home:"Home",entrance:"Entrance",great:"Great Room",rant:"Rant Room"};function showScreen(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.getElementById("status").textContent=labels[id]+" • v0.3";location.hash=id;window.scrollTo(0,0)}const q=location.hash.slice(1);if(["home","entrance","great","rant"].includes(q))showScreen(q);</script></body></html>
