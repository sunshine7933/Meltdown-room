<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#21150d">
<title>The Meltdown Room</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#21150d;font-family:system-ui,-apple-system,sans-serif}
body{overflow-x:hidden;color:#fff}
.screen{display:none;position:relative;width:100%;min-height:100vh;background:#21150d}
.screen.active{display:flex;align-items:center;justify-content:center}
.scene{display:block;width:100%;height:auto;max-height:100vh;object-fit:contain}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;z-index:10;-webkit-tap-highlight-color:rgba(255,255,255,.18);touch-action:manipulation}
.status{position:fixed;z-index:50;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:999px;background:rgba(32,21,13,.82);border:1px solid #9a774b;color:#f7e3bd;font-size:12px;pointer-events:none}

/* Home */
#homeHouse{left:32%;top:10%;width:58%;height:50%}
#homeEntrance{left:0;bottom:0;width:22%;height:30%}

/* Porch — intentionally generous ENTER zone */
#porchEnter{left:22%;top:48%;width:56%;height:40%}
#porchHome{left:0;bottom:0;width:24%;height:24%}

/* Great Room */
#greatBack{left:0;bottom:0;width:20%;height:15%}
#greatHome{right:0;bottom:0;width:20%;height:15%}
#greatRant{left:0;top:70%;width:28%;height:23%}

/* Rant Room */
#rantBack{left:0;bottom:0;width:24%;height:15%}
#rantHome{right:0;bottom:0;width:24%;height:15%}

@media(max-width:700px){
 .screen.active{align-items:flex-start}
 .scene{width:100%;height:100vh;object-fit:contain}
 #homeHouse{left:22%;top:13%;width:74%;height:48%}
 #homeEntrance{left:0;bottom:0;width:35%;height:30%}
 #porchEnter{left:15%;top:42%;width:70%;height:46%}
 #porchHome{left:0;bottom:0;width:32%;height:22%}
 #greatRant{left:0;top:68%;width:35%;height:26%}
 #greatBack{left:0;bottom:0;width:32%;height:14%}
 #greatHome{right:0;bottom:0;width:32%;height:14%}
 #rantBack{left:0;bottom:0;width:32%;height:14%}
 #rantHome{right:0;bottom:0;width:32%;height:14%}
}
</style>
</head>
<body>
<div class="status" id="status">Home • v0.3.1</div>

<section class="screen active" id="home">
 <img class="scene" src="home.png" alt="The Meltdown Room Home">
 <button class="hotspot" id="homeHouse" onclick="showScreen('entrance')" aria-label="Go to entrance"></button>
 <button class="hotspot" id="homeEntrance" onclick="showScreen('entrance')" aria-label="Go to entrance"></button>
</section>

<section class="screen" id="entrance">
 <img class="scene" src="entrance.png" alt="The Meltdown Room Entrance">
 <button class="hotspot" id="porchEnter" onclick="showScreen('great')" aria-label="Enter Great Room"></button>
 <button class="hotspot" id="porchHome" onclick="showScreen('home')" aria-label="Return Home"></button>
</section>

<section class="screen" id="great">
 <img class="scene" src="great-room.png" alt="The Meltdown Room Great Room">
 <button class="hotspot" id="greatRant" onclick="showScreen('rant')" aria-label="Open Rant Room"></button>
 <button class="hotspot" id="greatBack" onclick="showScreen('entrance')" aria-label="Back to Entrance"></button>
 <button class="hotspot" id="greatHome" onclick="showScreen('home')" aria-label="Return Home"></button>
</section>

<section class="screen" id="rant">
 <img class="scene" src="rant-room.png" alt="The Meltdown Room Rant Room">
 <button class="hotspot" id="rantBack" onclick="showScreen('great')" aria-label="Back to Great Room"></button>
 <button class="hotspot" id="rantHome" onclick="showScreen('home')" aria-label="Return Home"></button>
</section>

<script>
const labels={home:"Home",entrance:"Entrance",great:"Great Room",rant:"Rant Room"};
function showScreen(id){
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.getElementById("status").textContent=labels[id]+" • v0.3.1";
 history.replaceState(null,"","#"+id);
 window.scrollTo(0,0);
}
const q=location.hash.slice(1);
if(["home","entrance","great","rant"].includes(q)) showScreen(q);
</script>
</body>
</html>
