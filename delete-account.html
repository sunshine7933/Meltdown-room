<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Delete Account | The Meltdown Room</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#21150d;color:#f7e3bd;font:17px/1.55 system-ui}main{max-width:620px;margin:auto;padding:46px 22px}section{padding:24px;border:1px solid #896b48;border-radius:20px;background:#2d1d13}h1{font-family:Georgia,serif;color:#ffd99a}label{display:block;margin:14px 0 6px;font-weight:700}input,button{box-sizing:border-box;width:100%;min-height:48px;border-radius:12px;padding:11px 13px;font:inherit}button{margin-top:14px;border:1px solid #ffc7b5;background:#8b3529;color:white;font-weight:800}button:disabled{opacity:.5}.muted{opacity:.82}a{color:#9ed9e7}</style></head><body><main><h1>Delete My Meltdown Room Account</h1><section><p>This permanently deletes your account and associated cloud backup data. Entries stored only on a device can be removed by clearing the app’s storage or uninstalling it.</p><form id="deleteForm"><label for="email">Account email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><label><input id="confirm" type="checkbox" style="width:auto;min-height:auto"> I understand this account deletion is permanent.</label><button id="deleteButton" type="submit">DELETE MY ACCOUNT</button></form><p id="status" role="status" aria-live="polite"></p><p class="muted">Need help? Email <a href="mailto:oc2co33610@gmail.com">oc2co33610@gmail.com</a>. Read the <a href="privacy.html">Privacy Policy</a>.</p></section></main><script>
const sb=supabase.createClient('https://bbppgqznghrqtezkgwwq.supabase.co','sb_publishable_Rc1CtgIXPSPMVor0ZySZ5g_t4TmmJyw');
const form=document.getElementById('deleteForm'),status=document.getElementById('status'),button=document.getElementById('deleteButton');
form.addEventListener('submit',async e=>{e.preventDefault();if(!document.getElementById('confirm').checked){status.textContent='Please confirm that you understand deletion is permanent.';return}button.disabled=true;status.textContent='Verifying your account…';try{const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;const response=await fetch('https://bbppgqznghrqtezkgwwq.supabase.co/functions/v1/delete-account',{method:'POST',headers:{Authorization:'Bearer '+data.session.access_token,'Content-Type':'application/json'},body:'{}'});if(!response.ok)throw new Error('Deletion could not be completed.');await sb.auth.signOut();form.hidden=true;status.textContent='Your account and associated cloud data were deleted.'}catch(error){status.textContent=error.message||'Deletion could not be completed. Contact support for help.';button.disabled=false}});
</script></body></html>
